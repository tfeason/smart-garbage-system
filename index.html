<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>智慧垃圾清理系統 - 第三組互動原型 v10.0</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --primary: #0f766e;
      --primary-light: #ccfbf1;
      --primary-dark: #115e59;
      --accent: #f59e0b;
      --accent-light: #fef3c7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 14px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #cbd5e1;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .app-shell {
      width: 100%;
      max-width: 520px;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.15);
      transition: max-width 0.25s ease;
    }
    .app-shell.tablet-wide { max-width: 960px; }

    .topbar {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .topbar-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .topbar-sub { font-size: 11px; opacity: 0.88; }
    .topbar-actions { display: flex; gap: 6px; }
    .btn-top {
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      color: #fff;
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-top.active { background: #f59e0b; border-color: #f59e0b; color: #1e293b; }

    .demo-drawer {
      display: none;
      background: #1e293b;
      color: #f8fafc;
      padding: 12px 16px;
      border-bottom: 2px solid #334155;
      font-size: 12px;
      z-index: 999;
    }
    .demo-drawer.open { display: block; }
    .demo-group-lbl { font-size: 11px; color: #94a3b8; margin: 8px 0 4px; font-weight: 700; }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }
    .btn-demo {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .btn-demo.on { background: #0f766e; border-color: #2dd4bf; }
    .btn-demo.warn { background: #991b1b; border-color: #f87171; }

    .content { flex: 1; padding: 14px; padding-bottom: 80px; overflow-y: auto; }
    .page { display: none; }
    .page.active { display: block; }

    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 8px;
    }

    /* 縣市切換標籤列 */
    .city-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }
    .city-tab {
      padding: 9px 6px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-size: 13px;
      font-weight: 800;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .city-tab.active {
      background: var(--primary-dark);
      color: #fff;
      border-color: var(--primary-dark);
      box-shadow: 0 3px 10px rgba(15, 118, 110, 0.25);
    }

    /* 大概位置智慧搜尋系統區塊 */
    .area-search-card {
      background: linear-gradient(180deg, #ffffff, #f8fafc);
      border: 1.5px solid #99f6e4;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }
    .area-search-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }
    .search-input {
      flex: 1;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-size: 13px;
      background: #fff;
      outline: none;
    }
    .search-input:focus { border-color: var(--primary); }
    .btn-search {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .quick-area-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .area-tag {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .area-tag:hover { background: var(--primary-light); color: var(--primary-dark); }

    .weather-strip {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      border-radius: 14px;
      padding: 11px 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .weather-main { display: flex; align-items: center; gap: 10px; }
    .weather-temp { font-size: 24px; font-weight: 900; line-height: 1; }
    .weather-meta { font-size: 11px; opacity: 0.94; text-align: right; line-height: 1.45; }

    .traffic-strip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 9px 12px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      font-size: 12px;
    }
    .traffic-dots { display: flex; gap: 8px; align-items: center; font-weight: 700; }

    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .filter-chip {
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .filter-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }
    .badge-ok { background: var(--primary-light); color: var(--primary-dark); }
    .badge-scheduled { background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .badge-collect { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .badge-redlight { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .badge-jam { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
    .badge-heavy-jam { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .badge-soon { background: #ffedd5; color: #c2410c; animation: pulse 1.2s infinite; }
    .badge-danger { background: var(--danger-light); color: var(--danger); animation: pulse 1s infinite; }
    .badge-dispatch { background: #dbeafe; color: #1d4ed8; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .schedule-pill-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .sched-tag {
      background: #f1f5f9;
      color: #334155;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .bus-card { transition: border-color 0.15s ease; }
    .bus-card.selected { border: 2px solid var(--primary); }
    .next-stop-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 9px 11px;
      border-radius: 8px;
      margin-top: 8px;
    }
    .next-stop-box.scheduled { background: #eef2ff; border-left-color: #4f46e5; }
    .next-stop-box.soon { background: #fff7ed; border-left-color: #ea580c; }
    .next-stop-box.collecting { background: #f0fdf4; border-left-color: #16a34a; }
    .next-stop-box.jammed { background: #fffbeb; border-left-color: #d97706; }
    .next-stop-title { font-size: 14px; font-weight: 800; color: var(--text); }
    .next-stop-meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px; }
    .passed-note {
      font-size: 11px;
      color: #475569;
      margin-top: 5px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .load-bar-bg {
      width: 100%;
      height: 7px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .load-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .card-quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-quick {
      padding: 9px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      text-align: center;
    }
    .btn-quick.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .metrics-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .metric-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
    }
    .metric-val { font-size: 16px; font-weight: 800; color: var(--text); }
    .metric-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }

    .truck-visual {
      background: #f8fafc;
      border: 2px dashed #cbd5e1;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
      margin: 10px 0;
    }
    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    .bus-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }
    .pill {
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    .map-wrap {
      position: relative;
      width: 100%;
      height: 360px;
      background: #e2e8f0;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }
    #realMap { width: 100%; height: 100%; z-index: 1; }
    .map-controls {
      position: absolute;
      right: 10px;
      top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 500;
    }
    .map-ctrl-btn {
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid #cbd5e1;
      background: rgba(255,255,255,0.96);
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
    .map-mode-badge {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 500;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .map-weather-pill {
      position: absolute;
      left: 10px;
      bottom: 24px;
      z-index: 500;
      background: rgba(255, 255, 255, 0.95);
      color: #0f172a;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
    .ext-maps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-ext {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      color: var(--text);
      display: block;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 0;
      z-index: 1000;
    }
    .app-shell.tablet-wide .bottom-nav { max-width: 960px; }
    .nav-item {
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }
    .nav-item.active { color: var(--primary); }
    .nav-icon { font-size: 18px; }
  </style>
</head>
<body>
<div class="app-shell" id="appShell">
  <div class="topbar">
    <div>
      <div class="topbar-title">🚛 智慧垃圾清理系統</div>
      <div class="topbar-sub">v10.0｜跨縣市班次・錯峰發車時程・區域位置搜尋</div>
    </div>
    <div class="topbar-actions">
      <button class="btn-top" id="btnLayout" onclick="toggleLayout()">寬版檢視</button>
      <button class="btn-top" id="btnDemoToggle" onclick="toggleDemo()">🎛️ 演示控制</button>
    </div>
  </div>

  <div class="demo-drawer" id="demoDrawer">
    <div class="demo-group-lbl">⏱️ 行車模擬節奏與錯峰發車</div>
    <div class="demo-grid">
      <button class="btn-demo on" id="btnRun" onclick="toggleRunning()">⏸️ 暫停／繼續行駛</button>
      <button class="btn-demo" id="btnSpeed" onclick="toggleSpeed()">⚡ 速度：1x（點此切換 4x）</button>
      <button class="btn-demo" id="btnLaunchNow" onclick="launchWaitingBuses()" style="grid-column: span 2;">🚀 讓本縣市「待發車」班次立即提前發車</button>
    </div>
    <div class="demo-group-lbl">🚦 塞車路況、天候與路口號誌</div>
    <div class="demo-grid">
      <button class="btn-demo" id="btnRushHour" onclick="toggleRushHour()">🚗 模擬尖峰塞車潮</button>
      <button class="btn-demo" id="btnToggleSignals" onclick="forceAllRedLights()">🚦 切換路口紅綠燈號誌</button>
      <button class="btn-demo" id="btnWeather" onclick="cycleWeather()" style="grid-column: span 2;">🌦️ 切換天氣（現實即時／高溫／雷雨）</button>
    </div>
    <div class="demo-group-lbl">🚨 突發事件與自動加派接管演示</div>
    <div class="demo-grid">
      <button class="btn-demo" id="btnFire" onclick="triggerIncident('fire')">🔥 示範：失火接管（0.0002%）</button>
      <button class="btn-demo" id="btnCrash" onclick="triggerIncident('crash')">💥 示範：車禍接管（0.00001%）</button>
      <button class="btn-demo" id="btnFullDemo" onclick="triggerIncident('full')" style="grid-column: span 2;">📦 示範：載量 100% 滿載・自動加派新車接管</button>
    </div>
  </div>

  <div class="content">
    <div class="page active" id="page-home">
      <!-- 1. 跨縣市切換列 -->
      <div class="city-tabs" id="cityTabs">
        <button class="city-tab active" data-city="kaohsiung" onclick="switchCity('kaohsiung')">高雄市 (6線)</button>
        <button class="city-tab" data-city="taichung" onclick="switchCity('taichung')">台中市 (3線)</button>
        <button class="city-tab" data-city="taipei" onclick="switchCity('taipei')">台北市 (3線)</button>
      </div>

      <!-- 2. 大概位置智慧搜尋系統 -->
      <div class="area-search-card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; font-weight:800; color:var(--primary-dark);">🔍 大概位置搜尋（輸入區名／地標／路名）</span>
          <button class="btn-sm" style="padding:4px 8px; font-size:11px;" onclick="useRealGPS()">📍 手機GPS</button>
        </div>
        <div class="area-search-row">
          <input type="text" class="search-input" id="areaSearchInput" placeholder="例：逢甲、信義、燕巢、大社、一中、士林..." onkeydown="if(event.key==='Enter') runAreaSearch()" />
          <button class="btn-search" onclick="runAreaSearch()">查詢</button>
        </div>
        <div class="quick-area-tags">
          <span class="area-tag" onclick="quickSearchArea('燕巢高科大')">燕巢高科大</span>
          <span class="area-tag" onclick="quickSearchArea('大社觀音山')">大社觀音山</span>
          <span class="area-tag" onclick="quickSearchArea('樹德科大')">樹德科大</span>
          <span class="area-tag" onclick="quickSearchArea('台中逢甲')">台中逢甲</span>
          <span class="area-tag" onclick="quickSearchArea('一中商圈')">一中商圈</span>
          <span class="area-tag" onclick="quickSearchArea('台北信義')">台北信義</span>
          <span class="area-tag" onclick="quickSearchArea('士林夜市')">士林夜市</span>
        </div>
        <div id="areaSearchResultBox" style="margin-top:8px; font-size:12px; color:#334155;"></div>
      </div>

      <!-- 3. 縣市即時氣象與塞車狀態 -->
      <div class="weather-strip" id="weatherBanner"></div>
      <div class="traffic-strip" id="trafficBanner"></div>

      <!-- 4. 班次狀態篩選 -->
      <div class="filter-row" id="filterRow">
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">全部班次</button>
        <button class="filter-chip" data-filter="running" onclick="setFilter('running')">🚛 已發車執勤中</button>
        <button class="filter-chip" data-filter="scheduled" onclick="setFilter('scheduled')">⏳ 待發車班表</button>
        <button class="filter-chip" data-filter="nearest" onclick="setFilter('nearest')">📍 離搜尋點最近</button>
        <button class="filter-chip" data-filter="jam" onclick="setFilter('jam')">🚗 塞車受影響</button>
      </div>

      <div id="busListContainer"></div>
    </div>

    <div class="page" id="page-detail">
      <div class="bus-pills" id="detailBusPills"></div>
      <div id="detailContainer"></div>
    </div>

    <div class="page" id="page-map">
      <div class="bus-pills" id="mapBusPills"></div>

      <div class="map-wrap">
        <div class="map-mode-badge" id="mapModeLabel">真實道路軌跡＋塞車熱區</div>
        <div class="map-weather-pill" id="mapWeatherPill">☀️ 載入現實氣象中...</div>
        <div class="map-controls">
          <button class="map-ctrl-btn" onclick="centerSelectedBus()" title="對焦目前車輛">🎯 對焦車輛</button>
          <button class="map-ctrl-btn" id="btnAllVehicles" onclick="toggleAllVehicles()" title="本市全路線總覽">🌐 本市總覽</button>
        </div>
        <div id="realMap"></div>
      </div>

      <div id="mapInfoCard" style="margin-top:10px;"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="switchTab('home')">
      <span class="nav-icon">🏠</span>
      <span>班次與搜尋</span>
    </button>
    <button class="nav-item" id="nav-map" onclick="switchTab('map')">
      <span class="nav-icon">🗺️</span>

  function calcGeoMeters(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
    return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  }

  function detectTrafficZone(city, lat, lng) {
    let worst = null;
    for (const tz of TRAFFIC_ZONES) {
      if (tz.city !== city || tz.level === 0) continue;
      const hit = tz.coords.some(c => calcGeoMeters(lat, lng, c[0], c[1]) <= tz.radiusMeters);
      if (hit && (!worst || tz.level > worst.level)) {
        worst = tz;
      }
    }
    return worst;
  }

  function interpolateAlongSegment(bus, segIdx, frac) {
    const sA = bus.stops[segIdx];
    const sB = bus.stops[segIdx + 1];
    const poly = (bus.segmentPaths && bus.segmentPaths[segIdx]) ? bus.segmentPaths[segIdx] : [[sA.lat, sA.lng], [sB.lat, sB.lng]];
    if (poly.length <= 2 || frac <= 0) {
      return {
        lat: sA.lat + (sB.lat - sA.lat) * frac,
        lng: sA.lng + (sB.lng - sA.lng) * frac
      };
    }
    const exactIdx = frac * (poly.length - 1);
    const i0 = Math.min(Math.floor(exactIdx), poly.length - 2);
    const subFrac = exactIdx - i0;
    const p0 = poly[i0];
    const p1 = poly[i0 + 1];
    return {
      lat: p0[0] + (p1[0] - p0[0]) * subFrac,
      lng: p0[1] + (p1[1] - p0[1]) * subFrac
    };
  }

  async function snapRouteToRealRoads(bus) {
    if (bus.roadSnapped) return;
    try {
      const coordsParam = bus.stops.map(s => `${s.lng},${s.lat}`).join(";");
      const url = `https://router.project-osrm.org/route/v1/driving/${coordsParam}?overview=false&steps=true`;
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      if (!data.routes || !data.routes[0] || !data.routes[0].legs) return;

      const legs = data.routes[0].legs;
      const segPaths = [];
      for (let i = 0; i < legs.length; i++) {
        const pts = [];
        legs[i].steps.forEach(step => {
          if (step.intersections) {
            step.intersections.forEach(inter => {
              pts.push([inter.location[1], inter.location[0]]);
            });
          }
        });
        if (pts.length >= 2) {
          segPaths.push(pts);
        } else {
          segPaths.push([[bus.stops[i].lat, bus.stops[i].lng], [bus.stops[i + 1].lat, bus.stops[i + 1].lng]]);
        }
      }
      bus.segmentPaths = segPaths;
      bus.roadSnapped = true;
    } catch (e) {}
  }

  async function snapCityRoutesToRoads(city) {
    const cityRoutes = ROUTES.filter(r => r.city === city);
    for (const bus of cityRoutes) {
      await snapRouteToRealRoads(bus);
    }
    renderAll();
  }

  function getBusTelemetry(bus) {
    const maxIdx = bus.stops.length - 1;
    const clamped = Math.min(bus.progress, maxIdx);
    const segIdx = Math.min(Math.floor(clamped), maxIdx - 1);
    const frac = clamped - segIdx;

    const pos = interpolateAlongSegment(bus, segIdx, frac);
    const curLat = pos.lat;
    const curLng = pos.lng;

    const tz = bus.startsInSec > 0 ? null : detectTrafficZone(bus.city, curLat, curLng);
    bus.activeTrafficZone = tz;

    // 離搜尋位置最近的站點
    let nearestIdx = 0;
    let minDist = Infinity;
    bus.stops.forEach((st, idx) => {
      const d = calcGeoMeters(st.lat, st.lng, state.userPos.lat, state.userPos.lng);
      if (d < minDist) {
        minDist = d;
        nearestIdx = idx;
      }
    });
    const nearestStop = bus.stops[nearestIdx];
    const walkMeters = minDist;

    // 發車時間與抵達最近站預估時間
    const departTimeStr = formatClockOffset(bus.departOffsetMin);
    const isScheduled = bus.startsInSec > 0;

    const isFinished = clamped >= maxIdx - 0.01;
    const nextStopIdx = isScheduled ? 0 : (bus.collectingCountdown > 0 ? Math.round(clamped) : (isFinished ? maxIdx : segIdx + 1));
    const nextStop = bus.stops[nextStopIdx];

    const remainSegsToNext = isScheduled ? 0 : (bus.collectingCountdown > 0 ? 0 : Math.max(0, nextStopIdx - clamped));
    const rainDelay = state.weatherIdx === 2 ? 1 : 0;
    const jamDelay = tz ? tz.delayMin : 0;
    const totalDelayMin = bus.delayMin + rainDelay + jamDelay;

    const remainSecToNext = isScheduled
      ? bus.startsInSec
      : Math.round(remainSegsToNext * 140 + totalDelayMin * 60);

    const remainMetersToNext = (isScheduled || bus.collectingCountdown > 0) ? 0 : calcGeoMeters(curLat, curLng, nextStop.lat, nextStop.lng);
    const isArrivingSoon = !isScheduled && !isFinished && !bus.isFullReturning && !bus.incidentType && bus.collectingCountdown === 0 && (remainSecToNext <= 60 || remainMetersToNext <= 150);

    const etaDate = new Date(Date.now() + remainSecToNext * 1000);
    const etaStr = etaDate.toTimeString().slice(0, 5);

    // 抵達「離你最近站點」的預估時間
    const segsToNearest = isScheduled ? nearestIdx : Math.max(0, nearestIdx - clamped);
    const secToNearest = (isScheduled ? bus.startsInSec : 0) + Math.round(segsToNearest * 140 + totalDelayMin * 60);
    const nearestEtaStr = new Date(Date.now() + secToNearest * 1000).toTimeString().slice(0, 5);

    const hasPassedNearest = !isScheduled && clamped > nearestIdx + 0.05 && bus.collectingCountdown === 0;
    const passedAgoMin = hasPassedNearest ? Math.max(1, Math.round((clamped - nearestIdx) * 2.5)) : 0;

    return {
      curLat, curLng, segIdx, frac, tz, totalDelayMin,
      isScheduled, departTimeStr,
      isFinished, nextStopIdx, nextStop,
      remainSecToNext, remainMetersToNext, isArrivingSoon,
      etaStr, nearestIdx, nearestStop, walkMeters, nearestEtaStr,
      hasPassedNearest, passedAgoMin
    };
  }

  function formatCountdown(sec) {
    if (sec <= 0) return "已到站";
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    if (m === 0) return `${s} 秒`;
    return `${m} 分 ${s.toString().padStart(2, "0")} 秒`;
  }

      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=Asia%2FTaipei`;
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      const cur = data.current;
      if (!cur) return;

      const temp = Math.round(cur.temperature_2m);
      const humidity = Math.round(cur.relative_humidity_2m);
      const code = cur.weather_code;
      const isRain = code >= 51;
      const isHot = !isRain && temp >= 31;
      const cityName = CITIES[state.currentCity].name;

      WEATHER_PRESETS[0] = {
        icon: isRain ? "⛈️" : (isHot ? "🔥" : "☀️"),
        condition: isRain ? "即時降雨（現實氣象）" : (isHot ? "即時晴朗高溫（現實氣象）" : "即時晴時多雲（現實氣象）"),
        outdoorTemp: temp,
        humidity: humidity,
        rainProb: isRain ? 80 : 15,
        wind: `風速 ${Math.round(cur.wind_speed_10m)} km/h`,
        advice: isRain
          ? `已連線氣象站偵測到${cityName}降雨，自動微調行車節奏`

        isLive: true
      };
      state.weatherIdx = 0;
      renderAll();

  function runAreaSearch() {
    const raw = (document.getElementById("areaSearchInput").value || "").trim();
    if (!raw) {
      state.areaSearchSummary = "";
      renderHome();
      return;
    }
    const q = raw.toLowerCase();

    // 1. 先從大概位置資料庫比對
    let matchedArea = AREA_DIRECTORY.find(item =>
      item.keywords.some(k => q.includes(k.toLowerCase()) || k.toLowerCase().includes(q)) ||
      item.label.toLowerCase().includes(q)
    );

    // 2. 若未命中地標庫，則從所有縣市路線站名中比對
    if (!matchedArea) {
      for (const r of ROUTES) {
        const hitStop = r.stops.find(s => s.name.toLowerCase().includes(q) || r.areaTag.toLowerCase().includes(q) || r.name.toLowerCase().includes(q));
        if (hitStop) {
          matchedArea = {
            city: r.city,
            label: `${CITIES[r.city].name}・${hitStop.name} 周邊`,
            lat: hitStop.lat,
            lng: hitStop.lng
          };
          break;
        }
      }
    }

    if (!matchedArea) {
      state.areaSearchSummary = `<div style="background:#fef2f2; color:#991b1b; padding:8px 10px; border-radius:8px; font-weight:700;">找不到「${raw}」相關區域，試試輸入：燕巢、大社、樹德、逢甲、一中、信義、士林。</div>`;
      renderHome();
      return;
    }

    // 自動切換到該縣市並更新定位點
    state.userPos = { name: matchedArea.label, lat: matchedArea.lat, lng: matchedArea.lng };
    if (state.currentCity !== matchedArea.city) {
      switchCity(matchedArea.city, true);
    }

    // 找出該縣市距離此位置最近的班次並列出發車與抵達資訊
    const cityBuses = ROUTES.filter(r => r.city === matchedArea.city)
      .map(bus => ({ bus, t: getBusTelemetry(bus) }))
      .sort((a, b) => a.t.walkMeters - b.t.walkMeters);

    const topMatches = cityBuses.slice(0, 2);
    const summaryLines = topMatches.map(({ bus, t }) => {
      const statusText = t.isScheduled
        ? `⏳ <b>${t.departTimeStr} 發車</b>（${formatCountdown(t.remainSecToNext)}後出發）`
        : (t.hasPassedNearest ? `✅ ${t.departTimeStr} 已發車（已過站）` : `🚛 ${t.departTimeStr} 已發車・預計 <b>${t.nearestEtaStr}</b> 抵「${t.nearestStop.name}」`);
      return `<div style="margin-top:4px;">• <b>${bus.id}</b>（${bus.areaTag}）：${statusText}</div>`;
    }).join("");

    state.areaSearchSummary = `
      <div style="background:#ecfdf5; border:1px solid #6ee7b7; padding:8px 10px; border-radius:9px; color:#065f46;">
        <div style="font-weight:800;">📍 搜尋位置：${matchedArea.label}</div>
        ${summaryLines}
      </div>
    `;
    state.filterMode = "nearest";
    document.querySelectorAll(".filter-chip").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.filter === "nearest");
    });
    renderAll();
  }

  function launchWaitingBuses() {
    let count = 0;
    ROUTES.forEach(bus => {
      if (bus.city === state.currentCity && bus.startsInSec > 0) {
        bus.startsInSec = 0;
        bus.departOffsetMin = 0;
        bus.load = Math.floor(Math.random() * 12) + 8;
        count += 1;

    if (count > 0) {
      state.systemAlert = `🚀 已觸發提前調度：${CITIES[state.currentCity].name}共有 ${count} 班待發車班次已提前發車進入路線！`;
    } else {
      state.systemAlert = `ℹ️ ${CITIES[state.currentCity].name}目前所有班次皆已發車執勤中。`;
    }
    renderAll();

  function dispatchReplacementVehicle(problemBus, reason) {
    problemBus.isFullReturning = true;
    problemBus.returnCountdown = 25;
    problemBus.dispatchCount += 1;
    const suffix = String.fromCharCode(64 + problemBus.dispatchCount);
    const newId = `${problemBus.baseId}-接管${suffix}`;
    const resumeProgress = reason === "full" ? 0 : Math.max(0, problemBus.progress);

    const newBus = {
      ...problemBus,
      id: newId,
      name: `${problemBus.name}（緊急加派接管車）`,
      departOffsetMin: 0,
      startsInSec: 0,
      load: reason === "full" ? 6 : Math.min(45, Math.round(problemBus.load * 0.4)),
      temp: WEATHER_PRESETS[state.weatherIdx].outdoorTemp + 4.2,
      progress: resumeProgress,
      incidentType: null,
      isFullReturning: false,
      returnCountdown: 0,
      collectingCountdown: 0,
      waitingRedLight: false,
      activeTrafficZone: null,
      dispatchCount: 0,
      stops: problemBus.stops.map(s => ({ ...s })),
      segmentPaths: problemBus.segmentPaths ? problemBus.segmentPaths.map(p => [...p]) : [],
      color: "#0284c7"
    };

    const idx = ROUTES.findIndex(r => r.id === problemBus.id);
    ROUTES.splice(idx + 1, 0, newBus);
    state.selectedBusId = newId;

    if (reason === "fire") {
      state.systemAlert = `🔥 緊急警報（0.0002% 失火事件）：${problemBus.id} 車斗達 65°C！已自動停駛並加派 ${newId} 接管路線。`;
    } else if (reason === "crash") {
      state.systemAlert = `💥 緊急警報（0.00001% 車禍事件）：${problemBus.id} 發生車禍！已自動加派 ${newId} 接管後續清運任務。`;
    } else {
      state.systemAlert = `📦 滿載調度：${problemBus.id} 載量達 100%！已加派 ${newId} 從起點重跑接管路線。`;
    }
  }

  function triggerIncident(type) {
    const cityRoutes = ROUTES.filter(b => b.city === state.currentCity && !b.isFullReturning && !b.incidentType && b.startsInSec === 0);
    const bus = cityRoutes.find(b => b.id === state.selectedBusId) || cityRoutes[0];
    if (!bus) {
      alert("本縣市目前執勤車輛皆已處於事故／滿載調度中，或尚未發車。");
      return;
    }
    if (type === "full") {
      bus.load = 100;
    } else {
      bus.incidentType = type;
      if (type === "fire") bus.temp = 65.0;
    }
    dispatchReplacementVehicle(bus, type);
    renderAll();
  }

          <div>☔ 降雨 ${w.rainProb}%</div>
          <div>🍃 ${w.wind}</div>
        </div>
      `;
    }

    const cityZones = TRAFFIC_ZONES.filter(z => z.city === state.currentCity);
    const heavyCount = cityZones.filter(z => z.level === 2).length;
    const slowCount = cityZones.filter(z => z.level === 1).length;
    const tBanner = document.getElementById("trafficBanner");
    if (tBanner) {
      tBanner.innerHTML = `
        <div style="font-weight:800; color:var(--text);">🚦 ${cityObj.name}即時路況</div>
        <div class="traffic-dots">
          <span style="color:#dc2626;">🔴 塞車 ${heavyCount} 段</span>
          <span style="color:#d97706;">🟡 緩行 ${slowCount} 段</span>
          <span style="color:#0f766e;">🟢 順暢 ${Math.max(0, cityZones.length - heavyCount - slowCount)} 段</span>
        </div>
      `;
    }

    const pill = document.getElementById("mapWeatherPill");
    if (pill) {
      pill.textContent = `${cityObj.name} ${w.icon}${w.outdoorTemp}°C ｜ 🔴塞車${heavyCount} 🟡緩行${slowCount}`;
    }
  }

  function renderHome() {
    renderWeatherAndTrafficBanners();
    document.getElementById("areaSearchResultBox").innerHTML = state.areaSearchSummary;

    const cityRoutes = ROUTES.filter(b => b.city === state.currentCity);
    let listWithTelemetry = cityRoutes.map(bus => ({ bus, t: getBusTelemetry(bus) }));

    if (state.filterMode === "running") {
      listWithTelemetry = listWithTelemetry.filter(item => !item.t.isScheduled);
    } else if (state.filterMode === "scheduled") {
      listWithTelemetry = listWithTelemetry.filter(item => item.t.isScheduled);
    } else if (state.filterMode === "nearest") {
      listWithTelemetry.sort((a, b) => a.t.walkMeters - b.t.walkMeters);
      listWithTelemetry = listWithTelemetry.slice(0, 3);
    } else if (state.filterMode === "jam") {
      listWithTelemetry = listWithTelemetry.filter(item => item.t.tz !== null);
    }

    const container = document.getElementById("busListContainer");
    const bannerHtml = state.systemAlert
      ? `<div class="card" style="background:#fef2f2; border-color:#fca5a5; font-size:12px; font-weight:700; color:#991b1b;">${state.systemAlert}</div>`
      : "";

    if (listWithTelemetry.length === 0) {
      container.innerHTML = bannerHtml + `<div class="card" style="text-align:center; color:var(--muted); font-size:13px;">此篩選條件下目前沒有班次，請點「全部班次」查看。</div>`;
      return;
    }

    const w = WEATHER_PRESETS[state.weatherIdx];
    container.innerHTML = bannerHtml + listWithTelemetry.map(({ bus, t }) => {
      const isSelected = bus.id === state.selectedBusId;
      const loadColor = (bus.load >= 100 || bus.incidentType) ? "#dc2626" : (bus.load >= 85 ? "#f59e0b" : "#0f766e");

      let statusBadge = `<span class="badge badge-ok">● 行駛順暢</span>`;
      if (t.isScheduled) statusBadge = `<span class="badge badge-scheduled">⏳ 待發車（${t.departTimeStr} 出發）</span>`;
      else if (bus.incidentType === "fire") statusBadge = `<span class="badge badge-danger">🔥 失火 65°C・已接管</span>`;
      else if (bus.incidentType === "crash") statusBadge = `<span class="badge badge-danger">💥 發生車禍・已接管</span>`;
      else if (bus.isFullReturning) statusBadge = `<span class="badge badge-danger">🛑 100% 滿載返場</span>`;
      else if (bus.collectingCountdown > 0) statusBadge = `<span class="badge badge-collect">♻️ 到站收運中 (${bus.collectingCountdown}s)</span>`;
      else if (bus.waitingRedLight) statusBadge = `<span class="badge badge-redlight">🚦 紅燈停等</span>`;
      else if (t.tz && t.tz.level === 2) statusBadge = `<span class="badge badge-heavy-jam">🔴 嚴重塞車 +${t.tz.delayMin}分</span>`;
      else if (t.tz && t.tz.level === 1) statusBadge = `<span class="badge badge-jam">🟡 車多緩行 +${t.tz.delayMin}分</span>`;
      else if (t.isArrivingSoon) statusBadge = `<span class="badge badge-soon">🔔 即將抵達</span>`;
      else if (bus.id.includes("接管")) statusBadge = `<span class="badge badge-dispatch">➕ 緊急接管車</span>`;

      const nearestNote = t.hasPassedNearest
        ? `<div class="passed-note">⏭️ 離搜尋點最近站「${t.nearestStop.name}」<b>已離站</b>（約 ${t.passedAgoMin} 分前通過）</div>`
        : `<div class="passed-note">📍 離搜尋點最近站：${t.nearestStop.name}（距約 <b>${t.walkMeters}m</b>・預估 <b>${t.nearestEtaStr}</b> 抵達）</div>`;

      const jamNote = t.tz
        ? `<div style="font-size:11px; color:${t.tz.level === 2 ? "#dc2626" : "#b45309"}; font-weight:700; margin-top:4px;">🚗 目前行經壅塞區：${t.tz.name}（時速約 ${t.tz.speedKmh} km/h）</div>`
        : "";

      const boxClass = t.isScheduled ? "scheduled" : (bus.collectingCountdown > 0 ? "collecting" : (t.tz ? "jammed" : (t.isArrivingSoon ? "soon" : "")));

      return `
        <div class="card bus-card ${isSelected ? "selected" : ""}">
          <div class="card-header">
            <div>
              <div style="font-size:16px; font-weight:900;">${bus.id} <span style="font-size:12px; font-weight:700; color:var(--primary);">[${bus.areaTag}]</span></div>
              <div style="font-size:12px; font-weight:700; color:var(--text); margin-top:1px;">${bus.name}</div>
              <div class="schedule-pill-row">
                <span class="sched-tag">🕒 表定發車：${t.departTimeStr}</span>
                <span class="sched-tag">🛣️ 共 ${bus.stops.length} 站</span>
              </div>
            </div>
            <div>${statusBadge}</div>
          </div>

          ${nearestNote}
          ${jamNote}

          <div class="next-stop-box ${boxClass}">
            <div class="next-stop-title">
              ${t.isScheduled
                ? `首站待發：${bus.stops[0].name}`
                : (bus.collectingCountdown > 0
                  ? `正在停靠收垃圾：${t.nextStop.name}`
                  : (t.isFinished ? `終點站：${t.nextStop.name}` : `下一站（第 ${t.nextStopIdx + 1}/${bus.stops.length} 站）：${t.nextStop.name}`))}
            </div>
            <div class="next-stop-meta">
              <span>${t.isScheduled ? `發車時刻：<b>${t.departTimeStr}</b>` : `預計抵達：<b>${t.etaStr}</b>`}</span>
              <span>${t.isScheduled
                ? `距離發車倒數 <b>${formatCountdown(t.remainSecToNext)}</b>`
                : (bus.collectingCountdown > 0
                  ? "停等倒垃圾中（完成增容 +2%~6%）"
                  : (t.isFinished ? "今日清運完成" : `剩 <b>${formatCountdown(t.remainSecToNext)}</b>（約 ${t.remainMetersToNext}m）`))}</span>
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:9px; font-size:12px; color:var(--muted);">
            <span>車斗載量：<b>${bus.load}%</b>（僅到站增加）</span>
            <span>車斗 <b>${bus.temp.toFixed(1)}°C</b> ｜ 室外 <b>${w.outdoorTemp}°C</b></span>
          </div>
          <div class="load-bar-bg">
            <div class="load-bar-fill" style="width:${Math.min(bus.load, 100)}%; background:${loadColor};"></div>
          </div>

          <div class="card-quick-actions">
            <button class="btn-quick" onclick="selectBusAndOpenDetail('${bus.id}')">🚛 車輛載量與時程</button>
            <button class="btn-quick primary" onclick="selectBusAndOpenMap('${bus.id}')">🗺️ 地圖即時追蹤</button>
          </div>
        </div>
      `;
    }).join("");
  }

  function renderDetail() {
    const cityRoutes = ROUTES.filter(b => b.city === state.currentCity);
    const pills = document.getElementById("detailBusPills");
    if (pills) {
      pills.innerHTML = cityRoutes.map(b => {
        const active = b.id === state.selectedBusId ? "active" : "";
        return `<button class="pill ${active}" onclick="selectBusAndOpenDetail('${b.id}')">${b.id}</button>`;
      }).join("");
    }

    const bus = cityRoutes.find(b => b.id === state.selectedBusId) || cityRoutes[0];
    const t = getBusTelemetry(bus);
    const w = WEATHER_PRESETS[state.weatherIdx];
    const fillColor = (bus.load >= 100 || bus.incidentType) ? "#dc2626" : (bus.load >= 85 ? "#f59e0b" : "#0f766e");

    let alertTag = `<span class="badge badge-ok">✅ 路況順暢・溫控正常</span>`;
    if (t.isScheduled) alertTag = `<span class="badge badge-scheduled">⏳ 調度場待發車（${t.departTimeStr} 出發）</span>`;
    else if (bus.incidentType === "fire") alertTag = `<span class="badge badge-danger">🔥 失火警報 65°C・已派車接管</span>`;
    else if (bus.incidentType === "crash") alertTag = `<span class="badge badge-danger">💥 交通事故停駛・已派車接管</span>`;
    else if (bus.load >= 100) alertTag = `<span class="badge badge-danger">🛑 載量 100% 滿載・已派車接管</span>`;
    else if (bus.collectingCountdown > 0) alertTag = `<span class="badge badge-collect">♻️ 到站停等倒垃圾中</span>`;
    else if (bus.waitingRedLight) alertTag = `<span class="badge badge-redlight">🚦 路口紅燈停等中</span>`;
    else if (t.tz) alertTag = `<span class="badge ${t.tz.level === 2 ? "badge-heavy-jam" : "badge-jam"}">🚗 ${t.tz.level === 2 ? "嚴重塞車" : "車多緩行"} +${t.tz.delayMin}分</span>`;

    // 產生本班次錯峰站點預估時刻表（前 5 站預覽）
    const currentProgress = t.isScheduled ? 0 : bus.progress;
    const stopRows = bus.stops.map((st, idx) => {
      const segDiff = Math.max(0, idx - currentProgress);
      const secOffset = (t.isScheduled ? bus.startsInSec : 0) + Math.round(segDiff * 140 + t.totalDelayMin * 60);
      const stopEta = new Date(Date.now() + secOffset * 1000).toTimeString().slice(0, 5);
      const isPassed = !t.isScheduled && idx < Math.floor(bus.progress);
      return `<div style="display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px dashed #e2e8f0; font-size:12px; color:${isPassed ? "#94a3b8" : "#0f172a"};">
        <span>${st.name}</span>
        <b>${isPassed ? "已通過" : stopEta}</b>
      </div>`;
    }).join("");

    document.getElementById("detailContainer").innerHTML = `
      <div class="card">
        <div class="card-header">
          <div>
            <div style="font-size:11px; color:var(--muted); font-weight:700;">${CITIES[bus.city].name}・${bus.areaTag}（表定 ${t.departTimeStr} 發車）</div>
            <div style="font-size:20px; font-weight:900;">${bus.id}</div>
            <div style="font-size:12px; color:var(--muted);">${bus.name}</div>
          </div>
          ${alertTag}
        </div>

        <div class="truck-visual">
          <svg width="230" height="105" viewBox="0 0 230 105">
            <rect x="18" y="16" width="132" height="62" rx="8" fill="#ffffff" stroke="#334155" stroke-width="3"/>
            <rect x="21" y="${19 + (56 * (1 - Math.min(bus.load, 100) / 100))}" width="126" height="${56 * (Math.min(bus.load, 100) / 100)}" rx="5" fill="${fillColor}" opacity="0.32"/>
            <text x="84" y="54" text-anchor="middle" font-size="24" font-weight="900" fill="#0f172a">${bus.load}%</text>
            <path d="M154 32 H188 L202 52 V78 H154 Z" fill="#e2e8f0" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
            <rect x="164" y="38" width="22" height="14" rx="2" fill="#bae6fd" stroke="#334155" stroke-width="2"/>
            <circle cx="52" cy="84" r="12" fill="#1e293b"/>
            <circle cx="122" cy="84" r="12" fill="#1e293b"/>
            <circle cx="180" cy="84" r="12" fill="#1e293b"/>
          </svg>
          <div style="font-size:11px; color:var(--muted);">行駛途中載量固定；僅在到站停等倒垃圾結束時增加 2%~6%</div>
        </div>

        <div class="metrics-row">
          <div class="metric-box">
            <div class="metric-val" style="color:${bus.incidentType === "fire" ? "#dc2626" : "#0f172a"};">🌡️ ${bus.temp.toFixed(1)}°C</div>
            <div class="metric-lbl">車斗溫度（每 6 秒微幅更新）</div>
          </div>
          <div class="metric-box">
            <div class="metric-val" style="color:#0284c7;">${w.icon} ${w.outdoorTemp}°C</div>
            <div class="metric-lbl">室外氣溫・${w.condition}</div>
          </div>
          <div class="metric-box">
            <div class="metric-val">🕒 ${t.departTimeStr}</div>
            <div class="metric-lbl">本班次首站發車時間</div>
          </div>
          <div class="metric-box">
            <div class="metric-val" style="color:${t.tz ? "#dc2626" : "#0f766e"};">
              ${t.isScheduled ? "調度場待機" : (t.tz ? `${t.tz.speedKmh} km/h` : "42 km/h")}
            </div>
            <div class="metric-lbl">${t.tz ? `🚗 ${t.tz.name}` : "🟢 路況通行狀態"}</div>
          </div>
        </div>

        <button class="btn-primary" onclick="selectBusAndOpenMap('${bus.id}')">🗺️ 切換至真實地圖追蹤此車</button>
      </div>

      <div class="card">
        <div style="font-size:13px; font-weight:800; margin-bottom:6px;">📋 本班次各站動態預估時刻表（錯峰到站）</div>
        ${stopRows}
      </div>
    `;
  }

  let leafletMap = null;
  let routeLayerGroup = null;
  let vehicleLayerGroup = null;
  let trafficLayerGroup = null;

  function initRealMap() {
    if (leafletMap || typeof L === "undefined") return;
    const c = CITIES[state.currentCity];
    leafletMap = L.map("realMap", { zoomControl: false }).setView(c.center, c.zoom);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(leafletMap);

    routeLayerGroup = L.layerGroup().addTo(leafletMap);
    trafficLayerGroup = L.layerGroup().addTo(leafletMap);
    vehicleLayerGroup = L.layerGroup().addTo(leafletMap);
  }

  function updateRealMapMarkers() {
    if (!leafletMap) initRealMap();
    if (!leafletMap) return;

    routeLayerGroup.clearLayers();
    trafficLayerGroup.clearLayers();
    vehicleLayerGroup.clearLayers();

    // 1. 繪製當前縣市塞車路況光帶
    TRAFFIC_ZONES.filter(tz => tz.city === state.currentCity && tz.level > 0).forEach(tz => {
      const jamColor = tz.level === 2 ? "#ef4444" : "#f59e0b";
      L.polyline(tz.coords, {
        color: jamColor,
        weight: 10,
        opacity: 0.55,
        lineCap: "round"
      }).bindTooltip(`🚗 ${tz.name}（${tz.level === 2 ? "嚴重塞車" : "車多緩行"}・時速 ${tz.speedKmh} km/h）`).addTo(trafficLayerGroup);
    });

    // 2. 繪製當前縣市紅綠燈號誌
    TRAFFIC_LIGHTS.filter(tl => tl.city === state.currentCity).forEach(tl => {
      const isRed = isTrafficLightRed(tl, state.tickCount);
      const icon = L.divIcon({
        className: "",
        html: `<div style="background:#1e293b; border:1.5px solid #fff; border-radius:4px; padding:2px; display:flex; flex-direction:column; gap:2px; box-shadow:0 1px 4px rgba(0,0,0,0.4);">
          <span style="width:7px; height:7px; border-radius:50%; background:${isRed ? "#ef4444" : "#475569"}; display:block;"></span>
          <span style="width:7px; height:7px; border-radius:50%; background:${!isRed ? "#22c55e" : "#475569"}; display:block;"></span>
        </div>`,
        iconSize: [14, 24],
        iconAnchor: [7, 12]
      });
      L.marker([tl.lat, tl.lng], { icon }).bindTooltip(`${tl.name}（${isRed ? "紅燈" : "綠燈"}）`).addTo(trafficLayerGroup);
    });

    // 3. 繪製搜尋／使用者位置標記
    const userIcon = L.divIcon({
      className: "",
      html: `<div style="background:#2563eb; color:#fff; border:2px solid #fff; border-radius:999px; padding:2px 7px; font-size:10px; font-weight:800; white-space:nowrap; box-shadow:0 2px 6px rgba(0,0,0,0.3);">📍 搜尋位置</div>`,
      iconAnchor: [32, 12]
    });
    L.marker([state.userPos.lat, state.userPos.lng], { icon: userIcon }).bindTooltip(state.userPos.name).addTo(vehicleLayerGroup);

    // 4. 繪製本縣市垃圾車路線與車輛
    const cityRoutes = ROUTES.filter(b => b.city === state.currentCity);
    const busesToRender = state.showAllVehicles
      ? cityRoutes
      : cityRoutes.filter(b => b.id === state.selectedBusId);

    busesToRender.forEach(bus => {
      const t = getBusTelemetry(bus);
      const isMain = bus.id === state.selectedBusId;
      const splitIdx = Math.floor(Math.min(bus.progress, bus.stops.length - 1));

      let passedCoords = [];
      for (let i = 0; i < splitIdx; i++) {
        const seg = (bus.segmentPaths && bus.segmentPaths[i]) ? bus.segmentPaths[i] : [[bus.stops[i].lat, bus.stops[i].lng], [bus.stops[i + 1].lat, bus.stops[i + 1].lng]];
        passedCoords.push(...seg);
      }
      if (splitIdx < bus.stops.length - 1 && !t.isScheduled) {
        const curSeg = (bus.segmentPaths && bus.segmentPaths[splitIdx]) ? bus.segmentPaths[splitIdx] : [[bus.stops[splitIdx].lat, bus.stops[splitIdx].lng], [bus.stops[splitIdx + 1].lat, bus.stops[splitIdx + 1].lng]];
        const cutIdx = Math.floor(t.frac * (curSeg.length - 1));
        passedCoords.push(...curSeg.slice(0, cutIdx + 1), [t.curLat, t.curLng]);
      }
      if (passedCoords.length >= 2) {
        L.polyline(passedCoords, { color: "#94a3b8", weight: isMain ? 5 : 3, opacity: 0.85 }).addTo(routeLayerGroup);
      }

      let remainCoords = [[t.curLat, t.curLng]];
      if (splitIdx < bus.stops.length - 1) {
        const curSeg = (bus.segmentPaths && bus.segmentPaths[splitIdx]) ? bus.segmentPaths[splitIdx] : [[bus.stops[splitIdx].lat, bus.stops[splitIdx].lng], [bus.stops[splitIdx + 1].lat, bus.stops[splitIdx + 1].lng]];
        const cutIdx = Math.floor(t.frac * (curSeg.length - 1));
        remainCoords.push(...curSeg.slice(cutIdx + 1));
      }
      for (let i = splitIdx + 1; i < bus.stops.length - 1; i++) {
        const seg = (bus.segmentPaths && bus.segmentPaths[i]) ? bus.segmentPaths[i] : [[bus.stops[i].lat, bus.stops[i].lng], [bus.stops[i + 1].lat, bus.stops[i + 1].lng]];
        remainCoords.push(...seg);
      }
      if (remainCoords.length >= 2) {
        L.polyline(remainCoords, { color: bus.color, weight: isMain ? 5 : 3, dashArray: "8, 6", opacity: 0.95 }).addTo(routeLayerGroup);
      }

      if (!state.showAllVehicles || isMain) {
        bus.stops.forEach((st, idx) => {
          const isNext = idx === t.nextStopIdx && !t.isFinished;
          const isPassed = !t.isScheduled && idx <= splitIdx;
          const fillColor = isNext ? (bus.collectingCountdown > 0 ? "#16a34a" : "#ea580c") : (isPassed ? "#94a3b8" : "#ffffff");
          L.circleMarker([st.lat, st.lng], {
            radius: isNext ? 7 : 4.5,
            fillColor: fillColor,
            color: isNext ? "#ffffff" : bus.color,
            weight: 2,
            fillOpacity: 1
          }).bindTooltip(st.name).addTo(routeLayerGroup);
        });
      }

      const truckBg = t.isScheduled
        ? "#4f46e5"
        : ((bus.load >= 100 || bus.incidentType) ? "#dc2626" : (bus.collectingCountdown > 0 ? "#16a34a" : (t.tz ? "#d97706" : bus.color)));
      const statusTxt = t.isScheduled
        ? `⏳${t.departTimeStr}發車`
        : (bus.incidentType === "fire" ? "🔥失火" : (bus.incidentType === "crash" ? "💥車禍" : (bus.collectingCountdown > 0 ? "♻️收運中" : (bus.waitingRedLight ? "🚦紅燈" : (t.tz ? "🚗塞車" : `${bus.load}%`)))));

      const truckIcon = L.divIcon({
        className: "",
        html: `<div style="background:${truckBg}; color:#fff; border:2px solid #fff; border-radius:999px; padding:3px 8px; font-size:11px; font-weight:800; white-space:nowrap; box-shadow:0 3px 8px rgba(0,0,0,0.35);">🚛 ${bus.id} ${statusTxt}</div>`,
        iconAnchor: [52, 14]
      });
      const marker = L.marker([t.curLat, t.curLng], { icon: truckIcon }).addTo(vehicleLayerGroup);
      marker.on("click", () => selectBusOnMap(bus.id));
    });
  }

  function renderMapPage() {
    renderWeatherAndTrafficBanners();
    const cityRoutes = ROUTES.filter(b => b.city === state.currentCity);
    const pills = document.getElementById("mapBusPills");
    pills.innerHTML = cityRoutes.map(bus => {
      const t = getBusTelemetry(bus);
      const active = bus.id === state.selectedBusId ? "active" : "";
      const tag = t.isScheduled ? "⏳" : (bus.incidentType ? "🚨" : (bus.collectingCountdown > 0 ? "♻️" : (bus.waitingRedLight ? "🚦" : (t.tz ? "🚗" : ""))));
      return `<button class="pill ${active}" onclick="selectBusOnMap('${bus.id}')">${bus.id} ${tag}</button>`;
    }).join("");

    const selectedBus = cityRoutes.find(b => b.id === state.selectedBusId) || cityRoutes[0];
    const w = WEATHER_PRESETS[state.weatherIdx];
    const loadColor = (selectedBus.load >= 100 || selectedBus.incidentType) ? "#dc2626" : (selectedBus.load >= 85 ? "#f59e0b" : "#0f766e");

    document.getElementById("mapModeLabel").textContent = state.showAllVehicles
      ? `${CITIES[state.currentCity].name}全部 ${cityRoutes.length} 條路線總覽`
      : `${selectedBus.id}（${selectedBus.areaTag}・${selectedBus.stops.length} 站）`;
    document.getElementById("btnAllVehicles").style.background = state.showAllVehicles ? "#ccfbf1" : "rgba(255,255,255,0.96)";

    if (leafletMap) {
      setTimeout(() => leafletMap.invalidateSize(), 50);
    }
    updateRealMapMarkers();

    const t = getBusTelemetry(selectedBus);
    const gmapsUrl = `https://www.google.com/maps/search/?api=1&query=${t.curLat.toFixed(5)},${t.curLng.toFixed(5)}`;
    const appleMapsUrl = `https://maps.apple.com/?ll=${t.curLat.toFixed(5)},${t.curLng.toFixed(5)}&q=${encodeURIComponent(selectedBus.id + " 智慧垃圾車")}`;

    let statusPill = `<span class="badge badge-ok">沿道路順暢行駛</span>`;
    if (t.isScheduled) statusPill = `<span class="badge badge-scheduled">⏳ 待發車（${t.departTimeStr} 出發）</span>`;
    else if (selectedBus.incidentType === "fire") statusPill = `<span class="badge badge-danger">🔥 失火停駛・已派車接管</span>`;
    else if (selectedBus.incidentType === "crash") statusPill = `<span class="badge badge-danger">💥 車禍停駛・已派車接管</span>`;
    else if (selectedBus.collectingCountdown > 0) statusPill = `<span class="badge badge-collect">♻️ 到站收垃圾（${selectedBus.collectingCountdown}s 後增容）</span>`;
    else if (selectedBus.waitingRedLight) statusPill = `<span class="badge badge-redlight">🚦 紅燈停等中</span>`;
    else if (t.tz) statusPill = `<span class="badge ${t.tz.level === 2 ? "badge-heavy-jam" : "badge-jam"}">🚗 ${t.tz.level === 2 ? "嚴重塞車" : "車多緩行"} +${t.tz.delayMin}分</span>`;

    document.getElementById("mapInfoCard").innerHTML = `
      <div class="card" style="margin-bottom:0;">
        <div class="card-header">
          <div>
            <span style="font-size:15px; font-weight:900;">${selectedBus.id}</span>
            <span style="font-size:12px; color:var(--muted); margin-left:6px;">發車 ${t.departTimeStr}・車斗 ${selectedBus.temp.toFixed(1)}°C（室外 ${w.outdoorTemp}°C）</span>
          </div>
          ${statusPill}
        </div>

        ${t.tz ? `<div style="font-size:11px; color:#b45309; font-weight:700; margin-bottom:6px;">⚠️ 壅塞路段：${t.tz.name}（目前平均時速 ${t.tz.speedKmh} km/h）</div>` : ""}

        <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--muted);">
          <span>目前車斗載量：<b>${selectedBus.load}%</b>（僅到站增加）</span>
          <span style="color:var(--primary); font-weight:700; cursor:pointer;" onclick="selectBusAndOpenDetail('${selectedBus.id}')">展開時刻表與車斗圖 ＞</span>
        </div>
        <div class="load-bar-bg">
          <div class="load-bar-fill" style="width:${Math.min(selectedBus.load, 100)}%; background:${loadColor};"></div>
        </div>

        <div class="next-stop-box ${t.isScheduled ? "scheduled" : (selectedBus.collectingCountdown > 0 ? "collecting" : (t.tz ? "jammed" : ""))}">
          <div class="next-stop-title">
            ${t.isScheduled
              ? `首站待發：${selectedBus.stops[0].name}`
              : (selectedBus.collectingCountdown > 0 ? `停靠收垃圾：${t.nextStop.name}` : `下一站（第 ${t.nextStopIdx + 1}/${selectedBus.stops.length} 站）：${t.nextStop.name}`)}
          </div>
          <div class="next-stop-meta">
            <span>${t.isScheduled ? `表定發車：<b>${t.departTimeStr}</b>` : `預計抵達：<b>${t.etaStr}</b>`}</span>
            <span>${t.isScheduled
              ? `距離發車倒數 <b>${formatCountdown(t.remainSecToNext)}</b>`
              : (selectedBus.collectingCountdown > 0 ? `收運中 ${selectedBus.collectingCountdown} 秒` : `剩 <b>${formatCountdown(t.remainSecToNext)}</b>（${t.remainMetersToNext}m）`)}</span>
          </div>
        </div>

        <div class="ext-maps">
          <a class="btn-ext" href="${gmapsUrl}" target="_blank" rel="noopener">📍 在 Google Maps 開啟真實街景</a>
          <a class="btn-ext" href="${appleMapsUrl}" target="_blank" rel="noopener">🍎 在 Apple 地圖開啟</a>
        </div>
      </div>
    `;
  }

  function switchTab(tab) {
    state.tab = tab;
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
    document.getElementById(`page-${tab}`).classList.add("active");
    document.getElementById(`nav-${tab}`).classList.add("active");
    renderAll();
    if (tab === "map") {
      initRealMap();
      setTimeout(() => {
        if (leafletMap) leafletMap.invalidateSize();
        if (!state.showAllVehicles) centerSelectedBus();
      }, 80);
    }
  }

  function selectBusAndOpenDetail(id) {
    state.selectedBusId = id;
    switchTab("detail");
  }

  function selectBusAndOpenMap(id) {
    state.selectedBusId = id;
    state.showAllVehicles = false;
    switchTab("map");
  }

  function selectBusOnMap(id) {
    state.selectedBusId = id;
    renderMapPage();
    centerSelectedBus();
  }

  function toggleAllVehicles() {
    state.showAllVehicles = !state.showAllVehicles;
    renderMapPage();
    if (leafletMap) {
      const cityRoutes = ROUTES.filter(r => r.city === state.currentCity);
      if (state.showAllVehicles) {
        const allPts = [];
        cityRoutes.forEach(r => r.stops.forEach(s => allPts.push([s.lat, s.lng])));
        if (allPts.length > 0) {
          leafletMap.fitBounds(L.latLngBounds(allPts), { padding: [24, 24] });
        }
      } else {
        centerSelectedBus();
      }
    }
  }

  function centerSelectedBus() {
    if (!leafletMap) return;
    const cityRoutes = ROUTES.filter(r => r.city === state.currentCity);
    const bus = cityRoutes.find(b => b.id === state.selectedBusId) || cityRoutes[0];
    const t = getBusTelemetry(bus);
    leafletMap.setView([t.curLat, t.curLng], 15);
  }

  function useRealGPS() {
    if (!navigator.geolocation) {
      alert("此裝置瀏覽器不支援 GPS 定位，請直接輸入大概位置查詢。");
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        // 判斷離哪個縣市最近
        let closestCity = "kaohsiung";
        let minCityDist = Infinity;
        Object.keys(CITIES).forEach(k => {
          const d = calcGeoMeters(lat, lng, CITIES[k].center[0], CITIES[k].center[1]);
          if (d < minCityDist) {
            minCityDist = d;
            closestCity = k;
          }
        });
        state.userPos = { name: `手機即時 GPS (${lat.toFixed(4)}, ${lng.toFixed(4)})`, lat, lng };
        switchCity(closestCity, true);
        state.areaSearchSummary = `<div style="background:#ecfdf5; border:1px solid #6ee7b7; padding:8px 10px; border-radius:9px; color:#065f46; font-weight:700;">📍 已定位至 ${state.userPos.name}，並自動切換至${CITIES[closestCity].name}清運網。</div>`;
        renderAll();
      },
      () => {
        alert("未取得定位權限，可直接在上方搜尋欄輸入區名或地標（如：逢甲、信義、燕巢）。");
      }
    );
  }

  function toggleLayout() {
    document.getElementById("appShell").classList.toggle("tablet-wide");
    if (leafletMap) setTimeout(() => leafletMap.invalidateSize(), 260);
  }

  function toggleDemo() {
    const drawer = document.getElementById("demoDrawer");
    const btn = document.getElementById("btnDemoToggle");
    drawer.classList.toggle("open");
    btn.classList.toggle("active");
  }

  function toggleRunning() {
    state.running = !state.running;
    document.getElementById("btnRun").textContent = state.running ? "⏸️ 暫停／繼續行駛" : "▶️ 已暫停（點此繼續）";
  }

  function toggleSpeed() {
    state.speedMultiplier = state.speedMultiplier === 1 ? 4 : 1;
    document.getElementById("btnSpeed").textContent = `⚡ 速度：${state.speedMultiplier}x（點此切換）`;
  }

  function cycleWeather() {
    state.weatherIdx = (state.weatherIdx + 1) % WEATHER_PRESETS.length;
    renderAll();
  }

  function forceAllRedLights() {
    state.tickCount += 8;
    renderAll();
  }

  function toggleRushHour() {
    state.rushHourMode = !state.rushHourMode;
    const btn = document.getElementById("btnRushHour");
    btn.classList.toggle("warn", state.rushHourMode);
    btn.textContent = state.rushHourMode ? "🚗 尖峰塞車潮：開啟中（點此解除）" : "🚗 模擬尖峰塞車潮";

    TRAFFIC_ZONES.forEach((tz, idx) => {
      if (state.rushHourMode) {
        tz.level = idx % 2 === 0 ? 2 : 1;
        tz.speedKmh = tz.level === 2 ? 14 : 22;
        tz.delayMin = tz.level === 2 ? 6 : 3;
      } else {
        tz.level = idx % 3 === 0 ? 2 : 1;
        tz.speedKmh = tz.level === 2 ? 15 : 25;
        tz.delayMin = tz.level === 2 ? 5 : 2;
      }
    });
    renderAll();
  }

  function renderAll() {
    if (state.tab === "home") renderHome();
    if (state.tab === "detail") renderDetail();
    if (state.tab === "map") renderMapPage();
  }

  setInterval(() => {
    if (state.running) {
      state.tickCount += 1;
      const w = WEATHER_PRESETS[state.weatherIdx];

      if (!state.rushHourMode && state.tickCount % 15 === 0) {
        const pick = TRAFFIC_ZONES[Math.floor(Math.random() * TRAFFIC_ZONES.length)];
        const nextLvl = state.weatherIdx === 2 ? (Math.random() < 0.6 ? 2 : 1) : Math.floor(Math.random() * 3);
        pick.level = nextLvl;
        pick.speedKmh = nextLvl === 2 ? 15 : (nextLvl === 1 ? 25 : 42);
        pick.delayMin = nextLvl === 2 ? 5 : (nextLvl === 1 ? 2 : 0);
      }

      for (let i = ROUTES.length - 1; i >= 0; i--) {
        const bus = ROUTES[i];

        // 尚未發車的班次：倒數發車時間，倒數歸零才正式發車上路
        if (bus.startsInSec > 0) {
          bus.startsInSec = Math.max(0, bus.startsInSec - 1 * state.speedMultiplier);
          if (bus.startsInSec === 0) {
            bus.departOffsetMin = 0;
            bus.load = Math.floor(Math.random() * 8) + 4;
          }
          continue;
        }

        if (bus.isFullReturning || bus.incidentType) {
          bus.returnCountdown -= 1;
          if (bus.returnCountdown <= 0) {
            const sameCityLeft = ROUTES.filter(r => r.city === bus.city).length;
            if (sameCityLeft > 1) {
              if (state.selectedBusId === bus.id) {
                const nextBus = ROUTES.find(r => r.city === bus.city && r.id !== bus.id);
                if (nextBus) state.selectedBusId = nextBus.id;
              }
              ROUTES.splice(i, 1);
            }
          }
          continue;
        }

        if (state.tickCount % 6 === 0) {
          const normalBase = w.outdoorTemp + 4.5;
          const delta = (Math.random() * 0.4 - 0.2);
          const nextTemp = bus.temp + delta;
          bus.temp = Math.max(normalBase - 1.5, Math.min(normalBase + 2.0, Math.round(nextTemp * 10) / 10));
        }

        const roll = Math.random();
        if (roll < 0.000002) {
          bus.incidentType = "fire";
          bus.temp = 65.0;
          dispatchReplacementVehicle(bus, "fire");
          break;
        } else if (roll < 0.000002 + 0.0000001) {
          bus.incidentType = "crash";
          dispatchReplacementVehicle(bus, "crash");
          break;
        }

        if (bus.collectingCountdown > 0) {
          bus.collectingCountdown -= 1;
          if (bus.collectingCountdown === 0) {
            const addedLoad = Math.floor(Math.random() * 5) + 2;
            bus.load = Math.min(100, bus.load + addedLoad);
            if (bus.load >= 100 && ROUTES.length < 24) {
              dispatchReplacementVehicle(bus, "full");
              break;
            }
          }
          continue;
        }

        const t = getBusTelemetry(bus);
        const nearRedLight = TRAFFIC_LIGHTS.some(tl =>
          tl.city === bus.city && isTrafficLightRed(tl, state.tickCount) && calcGeoMeters(t.curLat, t.curLng, tl.lat, tl.lng) < 95
        );
        if (nearRedLight) {
          bus.waitingRedLight = true;
          continue;
        } else {
          bus.waitingRedLight = false;
        }

        const maxIdx = bus.stops.length - 1;
        const weatherSpeedFactor = state.weatherIdx === 2 ? 0.85 : 1;
        const jamSpeedFactor = t.tz ? (t.tz.level === 2 ? 0.30 : 0.65) : 1.0;

        const prevFloor = Math.floor(bus.progress);
        bus.progress = Math.min(maxIdx, bus.progress + bus.speedPerSec * state.speedMultiplier * weatherSpeedFactor * jamSpeedFactor);

        const curFloor = Math.floor(bus.progress);
        if (curFloor > prevFloor && curFloor > 0 && curFloor !== bus.lastCollectedStopIdx) {
          bus.progress = curFloor;
          bus.lastCollectedStopIdx = curFloor;
          bus.collectingCountdown = 3;
          continue;
        }

        if (bus.progress >= maxIdx) {
          bus.progress = 0;
          bus.lastCollectedStopIdx = 0;
        }
      }
    }
    renderAll();
  }, 1000);

  fetchRealWeather();
  snapCityRoutesToRoads("kaohsiung");
  renderAll();
</script>
</body>
</html>
